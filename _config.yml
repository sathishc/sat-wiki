title: sat-wiki
description: Personal LLM-maintained wiki — mental models, strategy, systems thinking, and more
remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: default

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3

footer_content: "sat-wiki — maintained by Jarvis"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - sources/
  - skills/
  - skills-lock.json
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - "*.sh"
