name: Deploy sat-wiki to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Prepare build layout
        run: |
          # MkDocs requires docs_dir to be a child of the config file location.
          # The repo is checked out at the workspace root, so we create a
          # temporary config one level above with docs_dir pointing back here.
          cd ..
          cp $GITHUB_WORKSPACE/mkdocs.yml mkdocs-build.yml
          sed -i "s|^docs_dir: \.$|docs_dir: $GITHUB_WORKSPACE|" mkdocs-build.yml
          sed -i 's|^site_dir: site$|site_dir: _site|' mkdocs-build.yml
          mkdocs build --config-file mkdocs-build.yml
          mv _site $GITHUB_WORKSPACE/_site

      - name: Build site
        run: echo "Build completed in prepare step"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

