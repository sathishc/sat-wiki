name: Deploy sat-wiki to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Prepare build layout
        run: |
          # MkDocs requires docs_dir to be a child of the config file location.
          # We move mkdocs.yml one level above the repo root so the wiki
          # directory itself becomes the docs_dir.
          cp sat-wiki/mkdocs.yml mkdocs.yml
          sed -i 's|^docs_dir: \.$|docs_dir: sat-wiki|' mkdocs.yml
          sed -i 's|^site_dir: site$|site_dir: _site|' mkdocs.yml

      - name: Build site
        run: mkdocs build --config-file mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

