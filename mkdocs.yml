site_name: sat-wiki
site_description: Personal LLM-maintained wiki — mental models, strategy, systems thinking, and more
site_author: Sat
docs_dir: .
site_dir: site
exclude_docs: |
  README.md
  sources/*
  skills/*
  skills-lock.json
  CLAUDE.md
  site/*
  _site/*
  .github/*
  requirements.txt
  mkdocs.yml
  memory/*

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html

